<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #081327; --card: #11223f; --border: #25416d; --ink: #eaf3ff; --muted: #8fb0d9; --accent: #7cc4ff; --btn-ink: #06182f; }
  body { background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; line-height: 1.6; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; padding: .6rem clamp(.75rem, 3vw, 1.5rem); background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar .judul { flex: 1 1 6rem; min-width: 0; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tombol { flex: none; display: inline-flex; align-items: center; padding: .4rem .9rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--accent); font-family: inherit; font-size: .85rem; font-weight: 500; text-decoration: none; cursor: pointer; }
  .tombol.utama { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { flex: 1; min-height: 0; padding: 1rem 0 3rem; overflow: auto; }
  body.mode-html main { padding: 0; overflow: hidden; }
  body.mode-html #isi { height: 100%; }
  #isi iframe { color-scheme: light dark; display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .tombol[hidden], .lompat[hidden] { display: none; }
  .lompat { flex: none; display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .lompat input { width: 3.6rem; padding: .3rem .4rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); font: inherit; text-align: center; -moz-appearance: textfield; }
  .lompat input::-webkit-outer-spin-button, .lompat input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .tombol[aria-label] { padding: .4rem .75rem; font-size: 1rem; line-height: 1.2; }
  .tombol svg { display: block; }
  /* docx-preview: halaman putih seperti di Word, latar sekitarnya mengikuti situs */
  #isi { display: flow-root; }
  #isi .docx-wrapper { background: transparent; padding: 0; align-items: center; }
  #isi .docx-wrapper > section.docx { background: #fff; color: #000; margin: 0 auto 1rem; box-shadow: 0 6px 24px rgba(0,0,0,.35); border-radius: 4px; }
  /* teks, markdown, gambar */
  #isi .teks { max-width: 52rem; margin: 0 auto; padding: 0 clamp(.75rem, 3vw, 1.5rem); font-family: 'Amiri', 'Poppins', serif; font-size: 1.15rem; line-height: 1.9; white-space: pre-wrap; word-wrap: break-word; unicode-bidi: plaintext; }
  #isi .teks.kode { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; line-height: 1.6; }
  #isi .md { white-space: normal; }
  #isi .md h1, #isi .md h2, #isi .md h3, #isi .md h4 { font-family: 'Poppins', sans-serif; line-height: 1.3; margin: 1.2em 0 .5em; }
  #isi .md p, #isi .md ul, #isi .md ol, #isi .md pre, #isi .md blockquote { margin: 0 0 1em; }
  #isi .md ul, #isi .md ol { padding-inline-start: 1.5rem; }
  #isi .md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; background: var(--card); padding: .1em .35em; border-radius: 4px; }
  #isi .md pre { background: var(--card); padding: .8rem; border-radius: 8px; overflow: auto; white-space: pre; }
  #isi .md pre code { background: none; padding: 0; }
  #isi .md blockquote { border-inline-start: 3px solid var(--border); padding-inline-start: 1rem; color: var(--muted); }
  #isi .md a { color: var(--accent); }
  #isi .md hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
  #isi .gambar { display: flex; justify-content: center; padding: 0 .75rem; }
  #isi .gambar img { max-width: 100%; height: auto; border-radius: 4px; background: #fff2; }
  .pesan { text-align: center; color: var(--muted); padding: 2rem 1rem; font-family: 'Poppins', sans-serif; font-size: .95rem; }
  .pesan a { color: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <a class="tombol" href="index.html" id="kembali">&larr; Folder</a>
  <div class="judul" id="judul">Viewer</div>
  <label class="lompat" id="lompat" hidden>Hal. <input id="nohal" type="number" inputmode="numeric" min="1" value="1" aria-label="Pindah ke halaman"> / <span id="totalhal">–</span></label>
  <button class="tombol" id="kecil" type="button" aria-label="Perkecil">&minus;</button>
  <button class="tombol" id="besar" type="button" aria-label="Perbesar">+</button>
  <button class="tombol" id="penuh" type="button" aria-label="Layar penuh" title="Layar penuh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="tombol utama" id="salin" type="button">Salin link</button>
</div>
<main>
  <div id="isi"><div class="pesan">Memuat dokumen…</div></div>
</main>
<script src="assets/docx-viewer/jszip.min.js"></script>
<script src="assets/docx-viewer/docx-preview.min.js"></script>
<script>
(function () {
  var isi = document.getElementById('isi');
  var param = new URLSearchParams(location.search).get('f') || '';
  // hanya file di dalam folder Data/ yang boleh dibuka
  var path = decodeURIComponent(param).replace(/\\/g, '/');
  // salin alamat viewer ini (bisa dibagikan, langsung membuka dokumen yang sama)
  var salin = document.getElementById('salin');
  var teksSalin = salin.textContent, timerSalin;
  function selesaiSalin(ok) {
    salin.textContent = ok ? 'Tersalin \u2713' : 'Gagal menyalin';
    clearTimeout(timerSalin);
    timerSalin = setTimeout(function () { salin.textContent = teksSalin; }, 1800);
  }
  salin.addEventListener('click', function () {
    var link = location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(link).then(function () { selesaiSalin(true); }, function () { selesaiSalin(false); });
      return;
    }
    var t = document.createElement('textarea');
    t.value = link; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* abaikan */ }
    t.remove();
    selesaiSalin(ok);
  });
  // layar penuh
  var penuh = document.getElementById('penuh');
  if (document.fullscreenEnabled) {
    penuh.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    });
  } else { penuh.hidden = true; }
  function pesan(html) { isi.innerHTML = '<div class="pesan">' + html + '</div>'; }

  if (!/^Data\//.test(path) || /(^|\/)\.\.(\/|$)/.test(path)) { pesan('Dokumen tidak ditemukan.'); return; }

  // kembali ke folder tempat file ini berada
  var folder = path.split('/').slice(1, -1);
  document.getElementById('kembali').href = 'index.html#/' + folder.map(encodeURIComponent).join('/');
  var url = path.split('/').map(encodeURIComponent).join('/');
  var nama = path.split('/').pop().replace(/\.[^.]+$/, '').trim();
  document.getElementById('judul').textContent = nama;
  document.title = nama + ' — As-Salmaniyyah';

  // halaman HTML materi dibuka di dalam bingkai (iframe), bar atas tetap ada
  if (/\.html?$/i.test(path)) {
    document.body.classList.add('mode-html');
    document.getElementById('kecil').hidden = true;
    document.getElementById('besar').hidden = true;
    var f = document.createElement('iframe');
    // tambahkan penanda waktu agar bingkai selalu memuat versi terbaru, bukan salinan lama dari cache
    f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
    f.title = nama;
    isi.replaceChildren(f);
    return;
  }

  var ext = (path.split('.').pop() || '').toLowerCase();
  var GAMBAR = /^(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/, MEDIA = /^(mp3|wav|ogg|m4a|aac|flac|opus|mp4|webm|mov|m4v|ogv)$/;

  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>');
    return t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // markdown sederhana: judul, daftar, kutipan, kode, garis, paragraf
  function markdown(src) {
    var out = [], lis = null, kode = null, par = [];
    function tutup() {
      if (par.length) { out.push('<p>' + par.join('<br>') + '</p>'); par = []; }
      if (lis) { out.push('</' + lis + '>'); lis = null; }
    }
    src.replace(/\r\n?/g, '\n').split('\n').forEach(function (b) {
      var m;
      if (kode !== null) {
        if (/^```/.test(b)) { out.push('<pre><code>' + esc(kode.join('\n')) + '</code></pre>'); kode = null; } else kode.push(b);
        return;
      }
      if (/^```/.test(b)) { tutup(); kode = []; return; }
      if (!b.trim()) { tutup(); return; }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(b))) { tutup(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); return; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(b)) { tutup(); out.push('<hr>'); return; }
      if ((m = /^\s*>\s?(.*)$/.exec(b))) { tutup(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); return; }
      if ((m = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(b))) {
        var t = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (par.length) tutup();
        if (lis !== t) { if (lis) out.push('</' + lis + '>'); out.push('<' + t + '>'); lis = t; }
        out.push('<li>' + inline(m[2]) + '</li>');
        return;
      }
      if (lis) tutup();
      par.push(inline(b.trim()));
    });
    if (kode !== null) out.push('<pre><code>' + esc(kode.join('\n')) + '</code></pre>');
    tutup();
    return out.join('');
  }

  if (ext === 'pdf') {
    // PDF digambar dengan pdf.js (tersimpan di assets/pdfjs) karena iframe PDF tidak jalan di banyak browser, terutama HP
    var sk = document.createElement('script');
    sk.src = 'assets/pdfjs/pdf.min.js';
    sk.onerror = function () { pesan('Penampil PDF gagal dimuat. Silakan <a href="' + url + '" download>unduh filenya</a>.'); };
    sk.onload = function () {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/pdfjs/pdf.worker.min.js';
      pdfjsLib.getDocument(url).promise.then(function (pdf) {
        var wrapP = document.createElement('div'), skala = 1, token = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), rasio = 1.414, halaman = 1;
        var main = document.querySelector('main'), kotak = document.getElementById('nohal'), obs = null;
        wrapP.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:0 .5rem';
        isi.replaceChildren(wrapP);
        document.getElementById('lompat').hidden = false;
        document.getElementById('totalhal').textContent = pdf.numPages;
        kotak.max = pdf.numPages;
        function posisi(el) { return el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop; }
        function ke(n) {
          n = Math.min(pdf.numPages, Math.max(1, Math.round(n) || 1));
          var el = wrapP.children[n - 1];
          if (el) main.scrollTop = posisi(el) - 4;
          halaman = n; kotak.value = n;
        }
        // gambar halaman hanya saat mendekati layar, supaya PDF ratusan halaman tetap ringan
        function lukis(el, my, lebar) {
          if (el.dataset.ok) return;
          el.dataset.ok = '1';
          pdf.getPage(+el.dataset.no).then(function (pg) {
            if (my !== token) return;
            var v0 = pg.getViewport({ scale: 1 }), sc = lebar / v0.width, v = pg.getViewport({ scale: sc * dpr });
            var c = document.createElement('canvas');
            c.width = v.width; c.height = v.height;
            c.style.cssText = 'display:block;width:' + lebar + 'px;height:' + (v.height / dpr) + 'px;max-width:none;border-radius:4px';
            el.style.height = (v.height / dpr) + 'px';
            el.replaceChildren(c);
            return pg.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
          });
        }
        function gambar() {
          var my = ++token, lebar = Math.max(240, Math.min(document.documentElement.clientWidth - 16, 1000)) * skala;
          if (obs) obs.disconnect();
          wrapP.replaceChildren();
          obs = new IntersectionObserver(function (es) {
            es.forEach(function (e) { if (e.isIntersecting) lukis(e.target, my, lebar); });
          }, { root: main, rootMargin: '1500px 0px' });
          for (var i = 1; i <= pdf.numPages; i++) {
            var d = document.createElement('div');
            d.dataset.no = i;
            d.style.cssText = 'flex:none;width:' + lebar + 'px;height:' + (lebar * rasio) + 'px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);border-radius:4px';
            wrapP.appendChild(d); obs.observe(d);
          }
        }
        function ubahPdf(f) {
          var n = halaman;
          skala = Math.min(3, Math.max(0.5, skala * f)); gambar(); ke(n);
        }
        // nomor halaman mengikuti posisi gulir
        main.addEventListener('scroll', function () {
          if (document.activeElement === kotak) return;
          var batas = main.getBoundingClientRect().top + main.clientHeight / 3, n = 1;
          for (var i = 0; i < wrapP.children.length; i++) {
            if (wrapP.children[i].getBoundingClientRect().top <= batas) n = i + 1; else break;
          }
          halaman = n; kotak.value = n;
        }, { passive: true });
        kotak.addEventListener('keydown', function (e) { if (e.key === 'Enter') { ke(kotak.value); kotak.blur(); } });
        kotak.addEventListener('change', function () { ke(kotak.value); });
        kotak.addEventListener('focus', function () { kotak.select(); });
        document.getElementById('kecil').onclick = function () { ubahPdf(1 / 1.25); };
        document.getElementById('besar').onclick = function () { ubahPdf(1.25); };
        var lb = document.documentElement.clientWidth, tm;
        window.addEventListener('resize', function () {
          clearTimeout(tm);
          tm = setTimeout(function () { if (document.documentElement.clientWidth !== lb) { lb = document.documentElement.clientWidth; var n = halaman; gambar(); ke(n); } }, 250);
        });
        pdf.getPage(1).then(function (p1) { var v = p1.getViewport({ scale: 1 }); rasio = v.height / v.width; gambar(); });
      }).catch(function () {
        pesan('PDF tidak bisa ditampilkan. Silakan <a href="' + url + '" download>unduh filenya</a>.');
      });
    };
    document.head.appendChild(sk);
    return;
  }

  if (GAMBAR.test(ext)) {
    var wrap = document.createElement('div'), img = document.createElement('img');
    wrap.className = 'gambar';
    img.alt = nama;
    img.onerror = function () { pesan('Gambar tidak bisa ditampilkan. Silakan <a href="' + url + '" download>unduh filenya</a>.'); };
    img.src = url;
    wrap.appendChild(img);
    isi.replaceChildren(wrap);
    var zg = 1;
    function ubahGambar(f) { zg = Math.min(4, Math.max(0.25, zg * f)); img.style.maxWidth = zg <= 1 ? '100%' : 'none'; img.style.width = (zg * 100) + "%"; }
    document.getElementById('kecil').onclick = function () { ubahGambar(1 / 1.25); };
    document.getElementById('besar').onclick = function () { ubahGambar(1.25); };
    return;
  }

  if (MEDIA.test(ext)) {
    var mt = document.createElement(/^(mp3|wav|ogg|m4a|aac|flac|opus)$/.test(ext) ? 'audio' : 'video');
    mt.controls = true; mt.src = url; mt.style.cssText = 'display:block;max-width:100%;margin:0 auto';
    mt.onerror = function () { pesan('Media tidak bisa diputar. Silakan <a href="' + url + '" download>unduh filenya</a>.'); };
    isi.replaceChildren(mt);
    return;
  }

  if (ext !== 'docx') {
    var md = /^(md|markdown)$/.test(ext);
    fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      // file biner (zip, xlsx, dll) tidak bisa dibaca sebagai teks
      var cek = new Uint8Array(buf, 0, Math.min(buf.byteLength, 8000));
      for (var i = 0; i < cek.length; i++) if (cek[i] === 0) throw new Error('biner');
      var t = new TextDecoder('utf-8').decode(buf);
      var d = document.createElement('div');
      d.className = 'teks' + (md ? ' md' : '') + (md || /^(txt|log)$/.test(ext) ? '' : ' kode');
      if (md) d.innerHTML = markdown(t); else d.textContent = t;
      isi.replaceChildren(d);
      var z = 1;
      function ubahTeks(f) { z = Math.min(3, Math.max(0.6, z * f)); d.style.zoom = z; }
      document.getElementById('kecil').onclick = function () { ubahTeks(1 / 1.15); };
      document.getElementById('besar').onclick = function () { ubahTeks(1.15); };
    }).catch(function () {
      pesan('Format ini (.' + ext + ') berupa file biner dan tidak bisa ditampilkan di viewer. Silakan <a href="' + url + '" download>unduh filenya</a>.');
    });
    return;
  }

  function sesuaikan() {
    // halaman Word berukuran tetap; di layar sempit diperkecil agar muat tanpa geser
    var w = isi.querySelector('.docx-wrapper');
    var hal = isi.querySelector('section.docx');
    if (!w || !hal) return;
    w.style.zoom = 1;
    var skala = Math.min(1, (document.documentElement.clientWidth - 16) / hal.offsetWidth);
    w.style.zoom = skala * pembesaran;
  }
  var pembesaran = 1;
  function ubah(f) { pembesaran = Math.min(4, Math.max(0.5, pembesaran * f)); sesuaikan(); }
  document.getElementById('kecil').onclick = function () { ubah(1 / 1.25); };
  document.getElementById('besar').onclick = function () { ubah(1.25); };

  fetch(url, { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function (buf) {
    isi.innerHTML = '';
    return docx.renderAsync(buf, isi, null, {
      className: 'docx', inWrapper: true, ignoreWidth: false, ignoreHeight: false,
      breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true
    });
  }).then(function () {
    sesuaikan();
    window.addEventListener('resize', sesuaikan);
  }).catch(function () {
    pesan('Dokumen tidak bisa ditampilkan. Silakan <a href="' + url + '" download>unduh filenya</a>.');
  });
})();
</script>
</body>
</html>
