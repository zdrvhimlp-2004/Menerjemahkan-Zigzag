<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #081327; --card: #11223f; --border: #25416d; --ink: #eaf3ff; --muted: #8fb0d9; --accent: #7cc4ff; --btn-ink: #06182f; }
  body { background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; line-height: 1.6; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .6rem; padding: .6rem clamp(.75rem, 3vw, 1.5rem); background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar .judul { flex: 1; min-width: 0; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tombol { flex: none; display: inline-flex; align-items: center; padding: .4rem .9rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--accent); font-family: inherit; font-size: .85rem; font-weight: 500; text-decoration: none; cursor: pointer; }
  .tombol.utama { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { flex: 1; min-height: 0; padding: 1rem 0 3rem; overflow: auto; }
  body.mode-html main { padding: 0; overflow: hidden; }
  body.mode-html #isi { height: 100%; }
  #isi iframe { color-scheme: light dark; display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .tombol[hidden] { display: none; }
  .tombol[aria-label] { padding: .4rem .75rem; font-size: 1rem; line-height: 1.2; }
  .tombol svg { display: block; }
  /* docx-preview: halaman putih seperti di Word, latar sekitarnya mengikuti situs */
  #isi { display: flow-root; }
  #isi .docx-wrapper { background: transparent; padding: 0; align-items: center; }
  #isi .docx-wrapper > section.docx { background: #fff; color: #000; margin: 0 auto 1rem; box-shadow: 0 6px 24px rgba(0,0,0,.35); border-radius: 4px; }
  .pesan { text-align: center; color: var(--muted); padding: 2rem 1rem; font-family: 'Poppins', sans-serif; font-size: .95rem; }
  .pesan a { color: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <a class="tombol" href="index.html" id="kembali">&larr; Folder</a>
  <div class="judul" id="judul">Viewer</div>
  <button class="tombol" id="kecil" type="button" aria-label="Perkecil">&minus;</button>
  <button class="tombol" id="besar" type="button" aria-label="Perbesar">+</button>
  <button class="tombol" id="penuh" type="button" aria-label="Layar penuh" title="Layar penuh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="tombol utama" id="salin" type="button">Salin link</button>
</div>
<main>
  <div id="isi"><div class="pesan">Memuat dokumen…</div></div>
</main>
<script src="assets/docx-viewer/jszip.min.js"></script>
<script src="assets/docx-viewer/docx-preview.min.js"></script>
<script>
(function () {
  var isi = document.getElementById('isi');
  var param = new URLSearchParams(location.search).get('f') || '';
  // hanya file di dalam folder Data/ yang boleh dibuka
  var path = decodeURIComponent(param).replace(/\\/g, '/');
  // salin alamat viewer ini (bisa dibagikan, langsung membuka dokumen yang sama)
  var salin = document.getElementById('salin');
  var teksSalin = salin.textContent, timerSalin;
  function selesaiSalin(ok) {
    salin.textContent = ok ? 'Tersalin \u2713' : 'Gagal menyalin';
    clearTimeout(timerSalin);
    timerSalin = setTimeout(function () { salin.textContent = teksSalin; }, 1800);
  }
  salin.addEventListener('click', function () {
    var link = location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(link).then(function () { selesaiSalin(true); }, function () { selesaiSalin(false); });
      return;
    }
    var t = document.createElement('textarea');
    t.value = link; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* abaikan */ }
    t.remove();
    selesaiSalin(ok);
  });
  // layar penuh
  var penuh = document.getElementById('penuh');
  if (document.fullscreenEnabled) {
    penuh.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    });
  } else { penuh.hidden = true; }
  function pesan(html) { isi.innerHTML = '<div class="pesan">' + html + '</div>'; }

  if (!/^Data\//.test(path) || /(^|\/)\.\.(\/|$)/.test(path)) { pesan('Dokumen tidak ditemukan.'); return; }

  // kembali ke folder tempat file ini berada
  var folder = path.split('/').slice(1, -1);
  document.getElementById('kembali').href = 'index.html#/' + folder.map(encodeURIComponent).join('/');
  var url = path.split('/').map(encodeURIComponent).join('/');
  var nama = path.split('/').pop().replace(/\.[^.]+$/, '').trim();
  document.getElementById('judul').textContent = nama;
  document.title = nama + ' — As-Salmaniyyah';

  // halaman HTML materi dibuka di dalam bingkai (iframe), bar atas tetap ada
  if (/\.html?$/i.test(path)) {
    document.body.classList.add('mode-html');
    document.getElementById('kecil').hidden = true;
    document.getElementById('besar').hidden = true;
    var f = document.createElement('iframe');
    f.src = url;
    f.title = nama;
    isi.replaceChildren(f);
    return;
  }

  if (!/\.docx$/i.test(path)) {
    pesan('Format ini (.' + path.split('.').pop() + ') tidak bisa ditampilkan di viewer. Silakan <a href="' + url + '" download>unduh filenya</a>.');
    return;
  }

  function sesuaikan() {
    // halaman Word berukuran tetap; di layar sempit diperkecil agar muat tanpa geser
    var w = isi.querySelector('.docx-wrapper');
    var hal = isi.querySelector('section.docx');
    if (!w || !hal) return;
    w.style.zoom = 1;
    var skala = Math.min(1, (document.documentElement.clientWidth - 16) / hal.offsetWidth);
    w.style.zoom = skala * pembesaran;
  }
  var pembesaran = 1;
  function ubah(f) { pembesaran = Math.min(4, Math.max(0.5, pembesaran * f)); sesuaikan(); }
  document.getElementById('kecil').onclick = function () { ubah(1 / 1.25); };
  document.getElementById('besar').onclick = function () { ubah(1.25); };

  fetch(url).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function (buf) {
    isi.innerHTML = '';
    return docx.renderAsync(buf, isi, null, {
      className: 'docx', inWrapper: true, ignoreWidth: false, ignoreHeight: false,
      breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true, renderEndnotes: true
    });
  }).then(function () {
    sesuaikan();
    window.addEventListener('resize', sesuaikan);
  }).catch(function () {
    pesan('Dokumen tidak bisa ditampilkan. Silakan <a href="' + url + '" download>unduh filenya</a>.');
  });
})();
</script>
</body>
</html>
