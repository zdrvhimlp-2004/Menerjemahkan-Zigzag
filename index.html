<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As-Salmaniyyah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #081327;
    --bg-glow: #0f2a52;
    --card: #11223f;
    --card-hover: #17305a;
    --border: #25416d;
    --text: #eaf3ff;
    --muted: #8fb0d9;
    --accent: #7cc4ff;
    --accent-strong: #4da3f5;
    --on-accent: #06182f;
  }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 480px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  .ar { font-family: 'Amiri', 'Traditional Arabic', serif; direction: rtl; unicode-bidi: isolate; }

  .page {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
  }

  /* ====== TOPBAR: search + login ====== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: .6rem;
    padding: .75rem 0;
    background: linear-gradient(var(--bg) 70%, transparent);
  }

  .search {
    flex: 1;
    position: relative;
  }
  .search svg {
    position: absolute;
    left: .9rem;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 44px;
    padding: 0 2.4rem 0 2.6rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font: inherit;
    font-size: .95rem;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 196, 255, .2);
  }
  .search .clear {
    position: absolute;
    right: .5rem;
    top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    display: none;
    place-items: center;
    background: transparent;
    border: 0;
    border-radius: 50%;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
  }
  .search .clear:hover { color: var(--text); background: var(--card-hover); }
  .search.has-text .clear { display: grid; }

  .btn-login {
    flex: none;
    height: 44px;
    padding: 0 1.1rem;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-weight: 600;
    font-size: .9rem;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-login:hover { background: #a2d6ff; }
  .btn-login:active { transform: scale(.97); }

  /* ====== PROFIL ====== */
  .profile {
    text-align: center;
    padding: 1.4rem 0 1.2rem;
  }
  .profile .logo {
    width: 76px; height: 76px;
    margin: 0 auto .8rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), var(--accent-strong));
    color: var(--on-accent);
    font-family: 'Amiri', serif;
    font-size: 2.4rem;
    font-weight: 700;
    box-shadow: 0 6px 24px rgba(77, 163, 245, .35);
  }
  .profile h1 { font-size: 1.25rem; font-weight: 600; }
  .profile p { color: var(--muted); font-size: .85rem; margin-top: .15rem; }

  /* ====== BREADCRUMB ====== */
  .crumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .35rem;
    margin-bottom: .9rem;
    font-size: .8rem;
    color: var(--muted);
  }
  .crumbs button {
    background: none;
    border: 0;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
    padding: .15rem .25rem;
    border-radius: 6px;
  }
  .crumbs button:hover { background: var(--card); }
  .crumbs .cur { color: var(--text); padding: .15rem .25rem; }
  .crumbs .sep { opacity: .5; }

  .section-title {
    text-align: center;
    margin-bottom: 1rem;
  }
  .section-title:empty { display: none; }
  .section-title small { display: block; color: var(--muted); font-size: .8rem; }

  /* ====== DAFTAR LINK / FOLDER ====== */
  .list { display: flex; flex-direction: column; gap: .65rem; }

  .item {
    display: flex;
    align-items: center;
    gap: .85rem;
    width: 100%;
    min-height: 62px;
    padding: .7rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .item:hover, .item:focus-visible {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    outline: none;
  }
  .item .ico {
    flex: none;
    width: 38px; height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: rgba(124, 196, 255, .14);
    color: var(--accent);
  }
  .item .ico svg { width: 20px; height: 20px; }
  .item .txt { flex: 1; min-width: 0; }
  .item .t-ar { display: block; font-size: 1.3rem; line-height: 1.5; }
  .item .t-id { display: block; font-weight: 500; font-size: .95rem; }
  .item .sub { display: block; color: var(--muted); font-size: .75rem; }
  .item .end {
    flex: none;
    min-width: 38px;
    text-align: right;
    color: var(--muted);
    font-size: .8rem;
  }
  .item .end svg { width: 18px; height: 18px; vertical-align: middle; }
  .item .end .count { margin-right: .35rem; font-size: .85rem; font-weight: 500; color: var(--accent); }

  .item.folder .ico { background: rgba(124, 196, 255, .22); }
  .item.soon {
    cursor: default;
    opacity: .6;
  }
  .item.soon:hover { transform: none; border-color: var(--border); background: var(--card); }
  .badge {
    display: inline-block;
    padding: .1rem .55rem;
    border-radius: 999px;
    background: rgba(124, 196, 255, .16);
    color: var(--accent);
    font-size: .7rem;
    font-weight: 500;
    white-space: nowrap;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    border-radius: 16px;
    font-size: .9rem;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .75rem;
    margin-top: 2rem;
    opacity: .8;
  }

  /* ====== MODAL LOGIN ====== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    place-items: center;
    padding: 1rem;
    background: rgba(3, 9, 20, .7);
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: grid; }
  .modal {
    width: 100%;
    max-width: 360px;
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: .2rem; }
  .modal p.lead { color: var(--muted); font-size: .8rem; margin-bottom: 1rem; }
  .modal label { display: block; font-size: .78rem; color: var(--muted); margin: .7rem 0 .25rem; }
  .modal input {
    width: 100%;
    height: 42px;
    padding: 0 .9rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 196, 255, .2); }
  .modal .actions { display: flex; gap: .6rem; margin-top: 1.2rem; }
  .modal .actions button {
    flex: 1;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .modal .actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .modal .msg { min-height: 1.2rem; margin-top: .8rem; font-size: .78rem; color: var(--accent); text-align: center; }

  @media (max-width: 420px) {
    .item .t-ar { font-size: 1.2rem; }
    .btn-login { padding: 0 .9rem; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- Paling atas: search + login -->
  <header class="topbar">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari" autocomplete="off" aria-label="Cari">
      <button class="clear" id="clearQ" aria-label="Hapus pencarian">&times;</button>
    </div>
    <button class="btn-login" id="btnLogin">Login</button>
  </header>

  <!-- Linktree -->
  <section class="profile">
    <div class="logo ar">س</div>
    <h1>As-Salmaniyyah</h1>
  </section>

  <nav class="crumbs" id="crumbs" aria-label="Lokasi"></nav>
  <div class="section-title" id="sectionTitle"></div>
  <main class="list" id="list"></main>

  <footer>&copy; As-Salmaniyyah</footer>
</div>

<!-- Login -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <form class="modal" id="loginForm">
    <h2 id="loginTitle">Masuk</h2>
    <p class="lead">Login untuk mengakses materi pribadi.</p>
    <label for="user">Email / Username</label>
    <input id="user" type="text" autocomplete="username" required>
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <div class="msg" id="loginMsg"></div>
    <div class="actions">
      <button type="button" id="cancelLogin">Batal</button>
      <button type="submit" class="primary">Masuk</button>
    </div>
  </form>
</div>

<script src="assets/beranda.js?v=5"></script>
</body>
</html>
