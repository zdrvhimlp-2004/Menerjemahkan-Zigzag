<button type="button" id="btn-legend" class="fab fab--legend" aria-haspopup="dialog" aria-controls="legend-modal" title="Kode Warna">?</button>
<button type="button" id="btn-toc" class="fab fab--toc" aria-haspopup="dialog" aria-controls="fihris-modal" title="Fihris (Daftar Isi)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
</button>
<script>
(function () {
  var toc = document.getElementById('fihris');
  var btn = document.getElementById('toc-toggle');
  if (toc && btn) {
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('data-open') !== '1';
      var ds = toc.querySelectorAll('details');
      for (var i = 0; i < ds.length; i++) ds[i].open = open;
      btn.setAttribute('data-open', open ? '1' : '0');
      btn.textContent = open ? 'Tutup semua' : 'Buka semua';
    });
  }

  function wireModal(openBtnId, dialogId) {
    var openBtn = document.getElementById(openBtnId);
    var dlg = document.getElementById(dialogId);
    if (!openBtn || !dlg) return;
    openBtn.addEventListener('click', function () { dlg.showModal(); });
    var closers = dlg.querySelectorAll('[data-close]');
    for (var i = 0; i < closers.length; i++) {
      closers[i].addEventListener('click', function () { dlg.close(); });
    }
    dlg.addEventListener('click', function (e) {
      var r = dlg.getBoundingClientRect();
      var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!inside) dlg.close();
    });
  }
  wireModal('btn-legend', 'legend-modal');
  wireModal('btn-toc', 'fihris-modal');

  var jumpLinks = document.querySelectorAll('#fihris a[href^="#"]');
  var fihrisDlg = document.getElementById('fihris-modal');
  for (var j = 0; j < jumpLinks.length; j++) {
    jumpLinks[j].addEventListener('click', function () {
      if (fihrisDlg) fihrisDlg.close();
    });
  }
})();
</script>
<script>
(function () {
  var crumb = document.getElementById('crumb-bar');
  if (!crumb) return;
  var pathEl = crumb.querySelector('.crumb__path');
  var pageEl = crumb.querySelector('.crumb__page');

  var all = Array.prototype.slice.call(document.querySelectorAll('h2.bab__ar'));
  var hals = Array.prototype.slice.call(document.querySelectorAll('.hal'));

  function label(el) {
    var next = el.nextElementSibling;
    if (next && next.classList && next.classList.contains('bab__id')) return next.textContent.trim();
    return el.textContent.trim();
  }
  function pageOf(el) {
    var span = el.querySelector('span');
    if (!span) return null;
    var m = span.textContent.match(/Hlm\.\s*(\d+)/);
    return m ? m[1] : null;
  }

  function update() {
    var y = window.scrollY + 96;
    var cur = null;
    for (var i = 0; i < all.length; i++) {
      var top = all[i].getBoundingClientRect().top + window.scrollY;
      if (top > y) break;
      cur = all[i];
    }
    if (!cur) { crumb.classList.remove('crumb--visible'); return; }
    crumb.classList.add('crumb--visible');
    pathEl.textContent = label(cur);

    var curPage = null;
    for (var j = 0; j < hals.length; j++) {
      var htop = hals[j].getBoundingClientRect().top + window.scrollY;
      if (htop >= y) { curPage = pageOf(hals[j]); break; }
    }
    if (curPage === null && hals.length) curPage = pageOf(hals[hals.length - 1]);
    pageEl.textContent = curPage ? ('Hlm. ' + curPage) : '';
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { update(); ticking = false; }); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
