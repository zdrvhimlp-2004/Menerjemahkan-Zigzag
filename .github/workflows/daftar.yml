name: Perbarui daftar.json

# Untuk hosting statis (tanpa PHP): bangun ulang daftar.json setiap isi folder Data/ berubah.
on:
  push:
    branches: [main]
    paths:
      - 'Data/**'
      - 'daftar.php'

permissions:
  contents: write

jobs:
  daftar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php daftar.php > daftar.json
      - name: Commit bila berubah
        run: |
          git diff --quiet daftar.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daftar.json
          git commit -m "Perbarui daftar.json otomatis"
          git push
